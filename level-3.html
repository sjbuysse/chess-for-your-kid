<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niveau Drie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ee;
    --ink: #2b2420;
    --faint: #93816c;
    --blue: #3d6b96;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 8vw;
    gap: 14px;
  }
  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 6vw, 30px);
  }
  p { color: var(--faint); font-weight: 600; font-size: 15px; max-width: 40ch; }
  a {
    margin-top: 10px;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    text-decoration: none;
    background: rgba(163, 144, 122, 0.14);
    padding: 8px 18px;
    border-radius: 999px;
  }
  a:active { color: var(--blue); }
</style>
</head>
<body>
  <h1>Niveau Drie</h1>
  <p>Hand van 5 kaarten &mdash; dit niveau is nog in de maak.</p>
  <a href="index.html">&larr; Terug naar het beginscherm</a>
</body>
</html>
