<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chess Moves Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ee;
    --card-bg: #fffdf8;
    --card-border: #a3907a;
    --ink: #2b2420;
    --caption-ink: #4a3f35;
    --faint: #93816c;
    --blue: #3d6b96;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    gap: 3vh;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 34px);
    text-align: center;
  }
  .subtitle {
    color: var(--faint);
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    margin-top: -1.6vh;
  }

  #levels {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .level {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--card-bg);
    border: 1.5px dashed var(--card-border);
    border-radius: 18px;
    padding: 18px 20px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .level:active { transform: scale(0.98); }
  .level:hover { border-color: var(--blue); }

  .level-name {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 19px;
  }
  .level-desc {
    color: var(--caption-ink);
    font-size: 14px;
    margin-top: 3px;
  }
</style>
</head>
<body>
  <h1>Schaakstukken Kaartspel</h1>
  <p class="subtitle">Kies een niveau om te starten</p>
  <div id="levels">
    <a class="level" href="level-1.html">
      <div class="level-name">Niveau Een</div>
      <div class="level-desc">&Eacute;&eacute;n kaart per beurt &mdash; tik voor een nieuwe.</div>
    </a>
    <a class="level" href="level-2.html">
      <div class="level-name">Niveau Twee</div>
      <div class="level-desc">Hand van 3 kaarten, telefoon plat tussen de spelers.</div>
    </a>
    <a class="level" href="level-3.html">
      <div class="level-name">Niveau Drie</div>
      <div class="level-desc">Hand van 5 kaarten &mdash; binnenkort beschikbaar.</div>
    </a>
  </div>
</body>
</html>
